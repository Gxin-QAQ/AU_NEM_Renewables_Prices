name: Deploy AU NEM dashboard to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "AU_NEM_Renewables_Prices/site/**"
      - "AU_NEM_Renewables_Prices/.github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: AU_NEM_Renewables_Prices/site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
